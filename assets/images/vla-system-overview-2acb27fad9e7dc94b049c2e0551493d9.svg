<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #FEF3C7;
      stroke: #F59E0B;
      stroke-width: 2;
    }
    .component {
      font-size: 12px;
      fill: #374151;
    }
    .dataflow {
      stroke: #10B981;
      stroke-width: 2;
      stroke-dasharray: 5,5;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <marker id="datahead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#F9FAFB" />

  <!-- Title -->
  <text x="600" y="40" class="title" text-anchor="middle" font-size="28">Vision-Language-Action (VLA) System Architecture</text>
  <text x="600" y="70" class="node" font-size="16" fill="#4B5563">Complete Pipeline from Natural Language to Physical Action</text>

  <!-- User Input Section -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="30" class="title">Human User</text>

    <!-- Voice Input -->
    <circle cx="50" cy="70" r="20" fill="#3B82F6" opacity="0.8"/>
    <text x="50" y="75" class="node" fill="white" font-size="10">🎤 Voice</text>

    <!-- Text Input -->
    <rect x="130" y="60" width="40" height="30" rx="5" fill="#3B82F6" opacity="0.8"/>
    <text x="150" y="80" class="node" fill="white" font-size="10">💬 Text</text>

    <text x="100" y="110" class="node" font-size="12" fill="#1E40AF">"Go to kitchen and bring red cup"</text>
  </g>

  <!-- Speech-to-Text Processing -->
  <g transform="translate(100, 280)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">Speech-to-Text</text>
    <text x="100" y="45" class="node" font-size="12" fill="#4F46E5">Whisper / Google STT</text>
  </g>

  <!-- Natural Language Understanding -->
  <g transform="translate(100, 380)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#C7D2FE" stroke="#6366F1" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">Natural Language</text>
    <text x="100" y="45" class="title">Understanding</text>
    <text x="100" y="65" class="node" font-size="12" fill="#4C1D95">Intent Recognition &amp; Entity Extraction</text>
  </g>

  <!-- LLM Planning -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="200" height="80" rx="8" fill="#A5B4FC" stroke="#4338CA" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">LLM Action</text>
    <text x="100" y="45" class="title">Planning</text>
    <text x="100" y="65" class="node" font-size="12" fill="#312E81">GPT-4 / Claude / Custom LLM</text>
  </g>

  <!-- Action Plan -->
  <g transform="translate(100, 620)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#818CF8" stroke="#3730A3" stroke-width="1" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">Action Plan</text>
    <text x="100" y="45" class="node" font-size="12" fill="#1E1B4B">(JSON Sequence)</text>
  </g>

  <!-- Vision System -->
  <g transform="translate(400, 120)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#FDE68A" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="30" class="title">Vision System</text>

    <!-- Camera Input -->
    <rect x="20" y="50" width="80" height="40" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
    <text x="60" y="75" class="node" font-size="11">📷 Camera</text>

    <!-- LiDAR Input -->
    <rect x="130" y="50" width="80" height="40" rx="5" fill="#FBBF24" stroke="#D97706" stroke-width="1"/>
    <text x="170" y="75" class="node" font-size="11">📡 LiDAR</text>

    <!-- Object Detection -->
    <rect x="20" y="110" width="80" height="40" rx="5" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <text x="60" y="130" class="node" font-size="10">🔍 Object</text>
    <text x="60" y="145" class="node" font-size="10">Detection</text>

    <!-- Semantic Segmentation -->
    <rect x="130" y="110" width="80" height="40" rx="5" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <text x="170" y="130" class="node" font-size="10">🎨 Semantic</text>
    <text x="170" y="145" class="node" font-size="10">Segmentation</text>

    <text x="125" y="170" class="node" font-size="12" fill="#92400E">Visual Perception Pipeline</text>
  </g>

  <!-- ROS 2 Infrastructure -->
  <g transform="translate(400, 340)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="30" class="title">ROS 2 Infrastructure</text>

    <!-- Publishers/Subscribers -->
    <rect x="20" y="50" width="80" height="30" rx="5" fill="#6EE7B7" stroke="#047857" stroke-width="1"/>
    <text x="60" y="70" class="node" font-size="10">📊 Topics</text>

    <!-- Services -->
    <rect x="130" y="50" width="80" height="30" rx="5" fill="#6EE7B7" stroke="#047857" stroke-width="1"/>
    <text x="170" y="70" class="node" font-size="10">⚙️ Services</text>

    <!-- Actions -->
    <rect x="75" y="90" width="100" height="30" rx="5" fill="#6EE7B7" stroke="#047857" stroke-width="1"/>
    <text x="125" y="110" class="node" font-size="10">🚀 Actions</text>

    <text x="125" y="135" class="node" font-size="12" fill="#065F46">Communication Framework</text>
  </g>

  <!-- Robot Control System -->
  <g transform="translate(400, 500)">
    <rect x="0" y="0" width="250" height="180" rx="10" fill="#FECACA" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="30" class="title">Robot Control System</text>

    <!-- Navigation Stack -->
    <rect x="20" y="50" width="90" height="40" rx="5" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1"/>
    <text x="65" y="70" class="node" font-size="10">🧭 Navigation</text>

    <!-- Manipulation -->
    <rect x="140" y="50" width="90" height="40" rx="5" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1"/>
    <text x="185" y="70" class="node" font-size="10">🦾 Manipulation</text>

    <!-- Joint Control -->
    <rect x="20" y="110" width="90" height="40" rx="5" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1"/>
    <text x="65" y="130" class="node" font-size="10">🔗 Joint Control</text>

    <!-- Safety Monitor -->
    <rect x="140" y="110" width="90" height="40" rx="5" fill="#FCA5A5" stroke="#B91C1C" stroke-width="1"/>
    <text x="185" y="130" class="node" font-size="10">🛡️ Safety</text>

    <text x="125" y="170" class="node" font-size="12" fill="#991B1B">Execution Layer</text>
  </g>

  <!-- Physical Robot -->
  <g transform="translate(750, 250)">
    <rect x="0" y="0" width="250" height="300" rx="10" fill="#E0E7FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="35" class="title">Physical Robot</text>

    <!-- Robot Body -->
    <rect x="50" y="60" width="150" height="100" rx="5" fill="#3B82F6" opacity="0.8"/>
    <text x="125" y="115" class="node" fill="white" font-size="12"> torso </text>

    <!-- Head -->
    <circle cx="125" cy="50" r="25" fill="#3B82F6" opacity="0.8"/>
    <text x="125" y="55" class="node" fill="white" font-size="10">head</text>

    <!-- Arms -->
    <rect x="20" y="70" width="30" height="80" rx="3" fill="#1E40AF" opacity="0.8"/>
    <rect x="200" y="70" width="30" height="80" rx="3" fill="#1E40AF" opacity="0.8"/>
    <text x="35" y="110" class="node" fill="white" font-size="8">left</text>
    <text x="35" y="120" class="node" fill="white" font-size="8">arm</text>
    <text x="215" y="110" class="node" fill="white" font-size="8">right</text>
    <text x="215" y="120" class="node" fill="white" font-size="8">arm</text>

    <!-- Legs -->
    <rect x="70" y="160" width="25" height="100" rx="3" fill="#1E40AF" opacity="0.8"/>
    <rect x="155" y="160" width="25" height="100" rx="3" fill="#1E40AF" opacity="0.8"/>
    <text x="82" y="210" class="node" fill="white" font-size="8">left</text>
    <text x="82" y="220" class="node" fill="white" font-size="8">leg</text>
    <text x="167" y="210" class="node" fill="white" font-size="8">right</text>
    <text x="167" y="220" class="node" fill="white" font-size="8">leg</text>

    <!-- Sensors -->
    <circle cx="125" cy="35" r="8" fill="#FBBF24"/>
    <circle cx="110" cy="35" r="4" fill="#FCD34D"/>
    <circle cx="140" cy="35" r="4" fill="#FCD34D"/>

    <!-- Actuators -->
    <circle cx="35" cy="150" r="6" fill="#F97316"/>
    <circle cx="215" cy="150" r="6" fill="#F97316"/>

    <text x="125" y="290" class="node" font-size="12" fill="#1E40AF">Real World Interaction</text>
  </g>

  <!-- Environment -->
  <g transform="translate(750, 580)">
    <rect x="0" y="0" width="250" height="120" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
    <text x="125" y="30" class="title">Environment</text>

    <!-- Kitchen Scene -->
    <rect x="20" y="50" width="60" height="40" rx="5" fill="#86EFAC" stroke="#15803D" stroke-width="1"/>
    <text x="50" y="75" class="node" font-size="10">🍳 Kitchen</text>

    <!-- Living Room -->
    <rect x="90" y="50" width="60" height="40" rx="5" fill="#86EFAC" stroke="#15803D" stroke-width="1"/>
    <text x="120" y="75" class="node" font-size="10">🛋️ Living</text>

    <!-- Bedroom -->
    <rect x="160" y="50" width="60" height="40" rx="5" fill="#86EFAC" stroke="#15803D" stroke-width="1"/>
    <text x="190" y="75" class="node" font-size="10">🛏️ Bed</text>

    <text x="125" y="110" class="node" font-size="12" fill="#15803D">Physical Space</text>
  </g>

  <!-- Data Flow Connections -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- User to STT -->
    <line x1="200" y1="240" x2="200" y2="280" marker-end="url(#arrowhead)"/>

    <!-- STT to NLU -->
    <line x1="200" y1="340" x2="200" y2="380" marker-end="url(#arrowhead)"/>

    <!-- NLU to LLM -->
    <line x1="200" y1="460" x2="200" y2="500" marker-end="url(#arrowhead)"/>

    <!-- LLM to Action Plan -->
    <line x1="200" y1="580" x2="200" y2="620" marker-end="url(#arrowhead)"/>

    <!-- Vision to ROS -->
    <line x1="525" y1="300" x2="525" y2="340" marker-end="url(#arrowhead)"/>

    <!-- Action Plan to ROS -->
    <line x1="200" y1="680" x2="525" y2="370" marker-end="url(#arrowhead)"/>

    <!-- ROS to Robot Control -->
    <line x1="525" y1="460" x2="525" y2="500" marker-end="url(#arrowhead)"/>

    <!-- Robot Control to Physical Robot -->
    <line x1="650" y1="590" x2="750" y2="400" marker-end="url(#arrowhead)"/>

    <!-- Physical Robot to Environment -->
    <line x1="875" y1="550" x2="875" y2="580" marker-end="url(#arrowhead)"/>

    <!-- Feedback Loop -->
    <line x1="950" y1="400" x2="950" y2="250" stroke="#F97316" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
    <text x="960" y="320" class="node" font-size="10" fill="#F97316">Feedback</text>
  </g>

  <!-- Feedback Loops -->
  <g stroke="#F97316" stroke-width="1.5" stroke-dasharray="5,3">
    <!-- Vision feedback to LLM -->
    <path d="M 525 400 C 600 450, 300 450, 200 540" marker-end="url(#arrowhead)"/>

    <!-- Robot status to ROS -->
    <path d="M 525 680 C 600 650, 600 550, 525 530" marker-end="url(#arrowhead)"/>

    <!-- Environment feedback to Vision -->
    <path d="M 875 700 C 800 650, 600 450, 525 320" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Action Execution Flow -->
  <g stroke="#10B981" stroke-width="2" stroke-dasharray="6,4">
    <!-- Plan to Execution -->
    <line x1="200" y1="650" x2="400" y2="550" marker-end="url(#datahead)"/>

    <!-- Vision to Action Coordination -->
    <line x1="450" y1="300" x2="450" y2="500" marker-end="url(#datahead)"/>

    <!-- Control to Physical -->
    <line x1="500" y1="680" x2="800" y2="400" marker-end="url(#datahead)"/>
  </g>

  <!-- Labels for Data Types -->
  <g font-size="10" fill="#3B82F6" font-weight="bold">
    <text x="250" y="260">Natural Language</text>
    <text x="250" y="320">Processed Text</text>
    <text x="250" y="420">Parsed Intent</text>
    <text x="250" y="540">Action Sequence</text>
    <text x="580" y="320">Sensor Data</text>
    <text x="580" y="420">Commands</text>
    <text x="580" y="540">Controls</text>
    <text x="800" y="380">Physical Actions</text>
    <text x="800" y="620">Environment State</text>
  </g>

  <!-- Process Stages -->
  <g transform="translate(30, 750)">
    <text x="0" y="0" class="title">VLA Process Stages:</text>

    <circle cx="10" cy="25" r="6" fill="#3B82F6"/>
    <text x="25" y="30" class="node" font-size="12">1. Language Input</text>

    <circle cx="10" cy="50" r="6" fill="#F59E0B"/>
    <text x="25" y="55" class="node" font-size="12">2. Vision Processing</text>

    <circle cx="10" cy="75" r="6" fill="#10B981"/>
    <text x="25" y="80" class="node" font-size="12">3. Action Planning</text>

    <circle cx="10" cy="100" r="6" fill="#DC2626"/>
    <text x="25" y="105" class="node" font-size="12">4. Physical Execution</text>
  </g>

  <!-- Key Technologies -->
  <g transform="translate(650, 750)">
    <text x="0" y="0" class="title">Key Technologies:</text>

    <rect x="0" y="15" width="120" height="25" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="60" y="32" class="node" font-size="11">ROS 2 (Humble)</text>

    <rect x="130" y="15" width="120" height="25" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="190" y="32" class="node" font-size="11">Isaac Sim</text>

    <rect x="0" y="50" width="120" height="25" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="60" y="67" class="node" font-size="11">OpenAI GPT-4</text>

    <rect x="130" y="50" width="120" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="190" y="67" class="node" font-size="11">YOLO Vision</text>

    <rect x="0" y="85" width="120" height="25" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="60" y="102" class="node" font-size="11">Whisper STT</text>

    <rect x="130" y="85" width="120" height="25" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="190" y="102" class="node" font-size="11">Isaac ROS</text>
  </g>

  <!-- System Capabilities -->
  <g transform="translate(950, 750)">
    <text x="0" y="0" class="title">Capabilities:</text>

    <text x="0" y="20" class="node" font-size="12">• Natural Language</text>
    <text x="0" y="35" class="node" font-size="10">  Understanding</text>

    <text x="0" y="55" class="node" font-size="12">• Real-time Vision</text>
    <text x="0" y="70" class="node" font-size="10">  Processing</text>

    <text x="0" y="90" class="node" font-size="12">• Action Planning</text>
    <text x="0" y="105" class="node" font-size="10">  & Sequencing</text>

    <text x="0" y="125" class="node" font-size="12">• Physical Execution</text>
    <text x="0" y="140" class="node" font-size="10">  & Control</text>

    <text x="0" y="160" class="node" font-size="12">• Multi-modal</text>
    <text x="0" y="175" class="node" font-size="10">  Integration</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 880)">
    <rect x="0" y="0" width="12" height="8" fill="#3B82F6"/>
    <text x="15" y="7" class="node" font-size="10">Forward Flow</text>

    <rect x="90" y="0" width="12" height="8" fill="#F97316"/>
    <text x="105" y="7" class="node" font-size="10">Feedback Loop</text>

    <rect x="180" y="0" width="12" height="8" fill="#10B981"/>
    <text x="195" y="7" class="node" font-size="10">Data Exchange</text>

    <rect x="280" y="0" width="12" height="8" fill="#DC2626"/>
    <text x="295" y="7" class="node" font-size="10">Control Signal</text>
  </g>

  <!-- System Boundaries -->
  <rect x="50" y="100" width="1100" height="620" rx="15" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="600" y="90" class="title" font-size="16">Complete VLA System Boundary</text>
</svg>