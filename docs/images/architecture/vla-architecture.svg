<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #FEF3C7;
      stroke: #F59E0B;
      stroke-width: 2;
    }
    .robot-component {
      fill: #DBEAFE;
      stroke: #2563EB;
      stroke-width: 1.5;
    }
    .ai-component {
      fill: #E0E7FF;
      stroke: #4F46E5;
      stroke-width: 1.5;
    }
    .action-component {
      fill: #FDE68A;
      stroke: #F59E0B;
      stroke-width: 1.5;
    }
    .user-component {
      fill: #D1FAE5;
      stroke: #065F46;
      stroke-width: 1.5;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB" />

  <!-- Title -->
  <text x="400" y="40" class="title" text-anchor="middle" font-size="24">Vision-Language-Action (VLA) System Architecture</text>
  <text x="400" y="70" class="node" font-size="16" fill="#4B5563">Complete pipeline from natural language to robot action</text>

  <!-- User Input Section -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="user-component" filter="url(#shadow)"/>
    <text x="75" y="30" class="title">Human User</text>

    <!-- Voice Input -->
    <circle cx="40" cy="55" r="15" fill="#3B82F6" opacity="0.8"/>
    <text x="40" y="60" class="node" fill="white" font-size="10">🎤 Voice</text>

    <!-- Text Input -->
    <rect x="90" y="45" width="40" height="25" rx="5" fill="#3B82F6" opacity="0.8"/>
    <text x="110" y="62" class="node" fill="white" font-size="10">💬 Text</text>
  </g>

  <!-- Natural Language Processing -->
  <g transform="translate(325, 120)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="ai-component" filter="url(#shadow)"/>
    <text x="75" y="25" class="title">Natural Language</text>
    <text x="75" y="45" class="title">Processing</text>
    <text x="75" y="65" class="node" font-size="12">LLM Understanding</text>
  </g>

  <!-- LLM Planner -->
  <g transform="translate(325, 240)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="ai-component" filter="url(#shadow)"/>
    <text x="75" y="25" class="title">LLM Action</text>
    <text x="75" y="45" class="title">Planner</text>
    <text x="75" y="65" class="node" font-size="12">GPT-4 / Claude</text>
  </g>

  <!-- Vision Processing -->
  <g transform="translate(550, 120)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="ai-component" filter="url(#shadow)"/>
    <text x="75" y="25" class="title">Vision</text>
    <text x="75" y="45" class="title">Processing</text>
    <text x="75" y="65" class="node" font-size="12">Object Detection</text>
  </g>

  <!-- Action Sequencer -->
  <g transform="translate(325, 360)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="action-component" filter="url(#shadow)"/>
    <text x="75" y="25" class="title">Action</text>
    <text x="75" y="45" class="title">Sequencer</text>
    <text x="75" y="65" class="node" font-size="12">Plan Execution</text>
  </g>

  <!-- Robot Control -->
  <g transform="translate(325, 480)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="robot-component" filter="url(#shadow)"/>
    <text x="75" y="25" class="title">Robot</text>
    <text x="75" y="45" class="title">Control</text>
    <text x="75" y="65" class="node" font-size="12">ROS 2 Actions</text>
  </g>

  <!-- Physical Robot -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="150" height="80" rx="10" class="robot-component" filter="url(#shadow)"/>
    <text x="75" y="25" class="title">Physical</text>
    <text x="75" y="45" class="title">Robot</text>
    <text x="75" y="65" class="node" font-size="12">Hardware</text>

    <!-- Robot visual elements -->
    <circle cx="30" cy="30" r="8" fill="#1E40AF" opacity="0.8"/>
    <rect x="25" y="40" width="10" height="25" fill="#1E40AF" opacity="0.8"/>
    <rect x="40" y="40" width="10" height="25" fill="#1E40AF" opacity="0.8"/>
    <rect x="25" y="65" width="8" height="15" fill="#1E40AF" opacity="0.7"/>
    <rect x="42" y="65" width="8" height="15" fill="#1E40AF" opacity="0.7"/>
  </g>

  <!-- Environment -->
  <g transform="translate(550, 480)">
    <rect x="0" y="0" width="150" height="80" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
    <text x="75" y="35" class="title">Environment</text>
    <text x="75" y="55" class="node" font-size="12">Physical World</text>
    <text x="75" y="70" class="node" font-size="10">Kitchen, Living Room, etc.</text>

    <!-- Objects in environment -->
    <circle cx="30" cy="30" r="6" fill="#EF4444" opacity="0.8"/>
    <rect x="60" cy="25" width="12" height="12" fill="#3B82F6" opacity="0.8"/>
    <rect x="90" cy="35" width="8" height="8" fill="#F59E0B" opacity="0.8"/>
  </g>

  <!-- Data Flow Connections -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- User to NLP -->
    <line x1="175" y1="160" x2="325" y2="160" marker-end="url(#arrowhead)"/>

    <!-- NLP to LLM -->
    <line x1="400" y1="200" x2="400" y2="240" marker-end="url(#arrowhead)"/>

    <!-- NLP to Vision -->
    <line x1="475" y1="160" x2="550" y2="160" marker-end="url(#arrowhead)"/>

    <!-- LLM to Action Sequencer -->
    <line x1="400" y1="320" x2="400" y2="360" marker-end="url(#arrowhead)"/>

    <!-- Vision to Action Sequencer -->
    <line x1="625" y1="200" x2="475" y2="400" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

    <!-- Action Sequencer to Robot Control -->
    <line x1="400" y1="440" x2="400" y2="480" marker-end="url(#arrowhead)"/>

    <!-- Robot Control to Physical Robot -->
    <line x1="325" y1="520" x2="175" y2="520" marker-end="url(#arrowhead)"/>

    <!-- Robot Control to Environment -->
    <line x1="475" y1="520" x2="550" y2="520" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Feedback Loops -->
  <g stroke="#F97316" stroke-width="1.5" stroke-dasharray="5,3">
    <!-- Vision feedback to LLM -->
    <path d="M 625 480 C 650 400, 475 300, 475 240" marker-end="url(#arrowhead)"/>

    <!-- Robot status to Action Sequencer -->
    <path d="M 175 540 C 250 500, 250 400, 325 400" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Process Labels -->
  <g font-size="12" fill="#3B82F6" font-weight="bold">
    <text x="250" y="150">Natural Language</text>
    <text x="250" y="165">Input</text>

    <text x="500" y="150">Vision Input</text>
    <text x="500" y="165">(Camera, LiDAR)</text>

    <text x="450" y="280">Action Planning</text>
    <text x="450" y="295">&amp; Reasoning</text>

    <text x="450" y="400">Action</text>
    <text x="450" y="415">Sequencing</text>

    <text x="250" y="510">Robot Control</text>
    <text x="250" y="525">&amp; Execution</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="12" height="8" class="user-component"/>
    <text x="15" y="7" class="node" font-size="10">User Input</text>

    <rect x="90" y="0" width="12" height="8" class="ai-component"/>
    <text x="105" y="7" class="node" font-size="10">AI Processing</text>

    <rect x="180" y="0" width="12" height="8" class="action-component"/>
    <text x="195" y="7" class="node" font-size="10">Action Planning</text>

    <rect x="280" y="0" width="12" height="8" class="robot-component"/>
    <text x="295" y="7" class="node" font-size="10">Robot Control</text>

    <line x1="370" y1="4" x2="385" y2="4" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="390" y="7" class="node" font-size="10">Data Flow</text>

    <line x1="460" y1="4" x2="475" y2="4" stroke="#F97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
    <text x="480" y="7" class="node" font-size="10">Feedback</text>
  </g>

  <!-- System Boundaries -->
  <rect x="80" y="100" width="640" height="480" rx="15" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="400" y="90" class="title" font-size="14">Complete VLA System</text>
</svg>