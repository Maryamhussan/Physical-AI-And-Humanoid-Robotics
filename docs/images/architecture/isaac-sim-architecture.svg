<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #FEF3C7;
      stroke: #F59E0B;
      stroke-width: 2;
    }
    .isaac-component {
      font-size: 12px;
      fill: #374151;
    }
    .simulation-element {
      fill: #E0F2FE;
      stroke: #0284C7;
      stroke-width: 1.5;
    }
    .ai-element {
      fill: #EDE9FE;
      stroke: #7C3AED;
      stroke-width: 1.5;
    }
    .data-element {
      fill: #F0FDF4;
      stroke: #16A34A;
      stroke-width: 1.5;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <!-- Neural network pattern -->
    <pattern id="neural-net" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#3B82F6" opacity="0.6"/>
      <line x1="10" y1="10" x2="20" y2="0" stroke="#3B82F6" stroke-width="0.5" opacity="0.3"/>
      <line x1="10" y1="10" x2="0" y2="20" stroke="#3B82F6" stroke-width="0.5" opacity="0.3"/>
    </pattern>

    <!-- Circuit pattern -->
    <pattern id="circuit" x="0" y="0" width="15" height="15" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#F97316" opacity="0.7"/>
      <line x1="2" y1="1" x2="13" y2="1" stroke="#F97316" stroke-width="1" opacity="0.5"/>
      <line x1="14" y1="1" x2="14" y2="14" stroke="#F97316" stroke-width="1" opacity="0.5"/>
      <circle cx="14" cy="14" r="1" fill="#F97316" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Background with neural network pattern -->
  <rect width="1000" height="800" fill="url(#neural-net)" opacity="0.05"/>

  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle" font-size="28">NVIDIA Isaac Sim Architecture</text>
  <text x="500" y="70" class="node" font-size="16" fill="#4B5563">Integrated Simulation, AI Training, and Synthetic Data Generation</text>

  <!-- Omniverse Platform -->
  <g transform="translate(500, 120)">
    <rect x="-150" y="0" width="300" height="60" rx="10" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="25" class="title">NVIDIA Omniverse Platform</text>
    <text x="0" y="45" class="node" font-size="12">Universal Scene Description (USD) | RTX Ray Tracing | Collaborative Environment</text>
  </g>

  <!-- Isaac Sim Core -->
  <g transform="translate(500, 210)">
    <rect x="-180" y="0" width="360" height="60" rx="10" fill="#E0E7FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="25" class="title">Isaac Sim Core</text>
    <text x="0" y="45" class="node" font-size="12">Simulation Engine | Physics | Rendering | Sensors</text>
  </g>

  <!-- Subsystems -->
  <g transform="translate(200, 310)">
    <!-- Physics Engine -->
    <rect x="0" y="0" width="140" height="60" rx="8" class="simulation-element" filter="url(#shadow)"/>
    <text x="70" y="25" class="title">Physics Engine</text>
    <text x="70" y="45" class="isaac-component">PhysX 5.0</text>
  </g>

  <g transform="translate(360, 310)">
    <!-- Rendering Engine -->
    <rect x="0" y="0" width="140" height="60" rx="8" class="simulation-element" filter="url(#shadow)"/>
    <text x="70" y="25" class="title">Rendering Engine</text>
    <text x="70" y="45" class="isaac-component">RTX Ray Tracing</text>
  </g>

  <g transform="translate(520, 310)">
    <!-- AI Training Framework -->
    <rect x="0" y="0" width="140" height="60" rx="8" class="ai-element" filter="url(#shadow)"/>
    <text x="70" y="25" class="title">AI Training</text>
    <text x="70" y="45" class="isaac-component">Reinforcement Learning</text>
  </g>

  <g transform="translate(680, 310)">
    <!-- Sensor Simulation -->
    <rect x="0" y="0" width="140" height="60" rx="8" class="simulation-element" filter="url(#shadow)"/>
    <text x="70" y="25" class="title">Sensor Simulation</text>
    <text x="70" y="45" class="isaac-component">Cameras, LiDAR, IMU</text>
  </g>

  <!-- Robot Models Section -->
  <g transform="translate(150, 410)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">Robot Models</text>

    <!-- URDF/SDF Import -->
    <rect x="10" y="40" width="80" height="30" rx="5" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="50" y="60" class="node" font-size="10">URDF/SDF</text>

    <!-- USD Export -->
    <rect x="110" y="40" width="80" height="30" rx="5" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="150" y="60" class="node" font-size="10">USD Model</text>
  </g>

  <!-- Environment Assets -->
  <g transform="translate(400, 410)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#D1FAE5" stroke="#065F46" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">Environment Assets</text>

    <!-- 3D Scenes -->
    <rect x="10" y="40" width="80" height="30" rx="5" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="50" y="60" class="node" font-size="10">3D Scenes</text>

    <!-- Materials -->
    <rect x="110" y="40" width="80" height="30" rx="5" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="150" y="60" class="node" font-size="10">Materials</text>
  </g>

  <!-- ROS 2 Integration -->
  <g transform="translate(650, 410)">
    <rect x="0" y="0" width="200" height="80" rx="10" fill="#FDE68A" stroke="#F59E0B" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" class="title">ROS 2 Bridge</text>
    <text x="100" y="45" class="node" font-size="12">Isaac ROS Extensions</text>

    <!-- Perception Nodes -->
    <rect x="10" y="50" width="55" height="25" rx="3" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <text x="37.5" y="67" class="node" font-size="9">Percep</text>

    <!-- Navigation Nodes -->
    <rect x="72.5" y="50" width="55" height="25" rx="3" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <text x="100" y="67" class="node" font-size="9">Nav</text>

    <!-- Manipulation Nodes -->
    <rect x="140" y="50" width="55" height="25" rx="3" fill="#FCD34D" stroke="#D97706" stroke-width="1"/>
    <text x="167.5" y="67" class="node" font-size="9">Manip</text>
  </g>

  <!-- Synthetic Data Pipeline -->
  <g transform="translate(200, 530)">
    <rect x="0" y="0" width="600" height="120" rx="10" fill="#E0E7FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
    <text x="300" y="25" class="title">Synthetic Data Generation Pipeline</text>

    <!-- RGB Generation -->
    <rect x="20" y="50" width="120" height="50" rx="5" fill="#A5B4FC" stroke="#4F46E5" stroke-width="1"/>
    <text x="80" y="70" class="node" font-size="11">RGB</text>
    <text x="80" y="85" class="node" font-size="9">Images</text>

    <!-- Depth Generation -->
    <rect x="150" y="50" width="120" height="50" rx="5" fill="#A5B4FC" stroke="#4F46E5" stroke-width="1"/>
    <text x="210" y="70" class="node" font-size="11">Depth</text>
    <text x="210" y="85" class="node" font-size="9">Maps</text>

    <!-- Segmentation -->
    <rect x="280" y="50" width="120" height="50" rx="5" fill="#A5B4FC" stroke="#4F46E5" stroke-width="1"/>
    <text x="340" y="70" class="node" font-size="11">Semantic</text>
    <text x="340" y="85" class="node" font-size="9">Segmentation</text>

    <!-- Normal Maps -->
    <rect x="410" y="50" width="120" height="50" rx="5" fill="#A5B4FC" stroke="#4F46E5" stroke-width="1"/>
    <text x="470" y="70" class="node" font-size="11">Normal</text>
    <text x="470" y="85" class="node" font-size="9">Maps</text>

    <!-- Instance Masks -->
    <rect x="540" y="50" width="40" height="50" rx="5" fill="#A5B4FC" stroke="#4F46E5" stroke-width="1"/>
    <text x="560" y="70" class="node" font-size="11">Instance</text>
    <text x="560" y="85" class="node" font-size="9">Masks</text>
  </g>

  <!-- Domain Randomization -->
  <g transform="translate(300, 680)">
    <rect x="0" y="0" width="400" height="80" rx="10" fill="#FEE2E2" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="200" y="25" class="title">Domain Randomization</text>

    <!-- Lighting -->
    <rect x="20" y="40" width="70" height="30" rx="5" fill="#FECACA" stroke="#B91C1C" stroke-width="1"/>
    <text x="55" y="60" class="node" font-size="10">Lighting</text>

    <!-- Materials -->
    <rect x="100" y="40" width="70" height="30" rx="5" fill="#FECACA" stroke="#B91C1C" stroke-width="1"/>
    <text x="135" y="60" class="node" font-size="10">Materials</text>

    <!-- Textures -->
    <rect x="180" y="40" width="70" height="30" rx="5" fill="#FECACA" stroke="#B91C1C" stroke-width="1"/>
    <text x="215" y="60" class="node" font-size="10">Textures</text>

    <!-- Environments -->
    <rect x="260" y="40" width="70" height="30" rx="5" fill="#FECACA" stroke="#B91C1C" stroke-width="1"/>
    <text x="295" y="60" class="node" font-size="10">Environments</text>

    <!-- Objects -->
    <rect x="340" y="40" width="40" height="30" rx="5" fill="#FECACA" stroke="#B91C1C" stroke-width="1"/>
    <text x="360" y="60" class="node" font-size="10">Objects</text>
  </g>

  <!-- Data Flow Connections -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- Omniverse to Isaac Sim -->
    <line x1="500" y1="180" x2="500" y2="210" marker-end="url(#arrowhead)"/>

    <!-- Isaac Sim to subsystems -->
    <line x1="500" y1="270" x2="270" y2="310" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="270" x2="430" y2="310" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="270" x2="590" y2="310" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="270" x2="750" y2="310" marker-end="url(#arrowhead)"/>

    <!-- Robot Models to Isaac Sim -->
    <line x1="250" y1="410" x2="420" y2="290" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="410" x2="500" y2="290" marker-end="url(#arrowhead)"/>
    <line x1="750" y1="410" x2="580" y2="290" marker-end="url(#arrowhead)"/>

    <!-- Isaac Sim to Synthetic Data Pipeline -->
    <line x1="500" y1="490" x2="500" y2="530" marker-end="url(#arrowhead)"/>

    <!-- Synthetic Data Pipeline to Domain Randomization -->
    <line x1="500" y1="650" x2="500" y2="680" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Isaac ROS Packages -->
  <g transform="translate(250, 20)">
    <text x="0" y="0" class="title">Isaac ROS Packages:</text>

    <!-- Perception -->
    <rect x="0" y="15" width="120" height="25" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="60" y="32" class="node" font-size="11">Perception</text>

    <!-- Navigation -->
    <rect x="130" y="15" width="120" height="25" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="190" y="32" class="node" font-size="11">Navigation</text>

    <!-- Manipulation -->
    <rect x="260" y="15" width="120" height="25" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="320" y="32" class="node" font-size="11">Manipulation</text>

    <!-- Sensors -->
    <rect x="390" y="15" width="120" height="25" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="450" y="32" class="node" font-size="11">Sensors</text>

    <!-- ISAAC ROS -->
    <rect x="520" y="15" width="120" height="25" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="580" y="32" class="node" font-size="11">Isaac ROS</text>
  </g>

  <!-- Key Technologies -->
  <g transform="translate(650, 60)">
    <text x="0" y="0" class="title">Key Technologies:</text>

    <rect x="0" y="15" width="100" height="20" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="50" y="30" class="node" font-size="10">Omniverse</text>

    <rect x="110" y="15" width="100" height="20" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="160" y="30" class="node" font-size="10">PhysX</text>

    <rect x="0" y="40" width="100" height="20" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="50" y="55" class="node" font-size="10">RTX Rendering</text>

    <rect x="110" y="40" width="100" height="20" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="160" y="55" class="node" font-size="10">USD</text>

    <rect x="0" y="65" width="100" height="20" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="50" y="80" class="node" font-size="10">CUDA</text>

    <rect x="110" y="65" width="100" height="20" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="160" y="80" class="node" font-size="10">TensorRT</text>
  </g>

  <!-- Integration Flow -->
  <g transform="translate(100, 700)">
    <text x="0" y="0" class="title">Integration Flow:</text>

    <!-- Sim to Real -->
    <rect x="0" y="15" width="120" height="30" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="60" y="35" class="node" font-size="11">Simulation</text>

    <!-- Arrow -->
    <line x1="125" y1="30" x2="155" y2="30" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Training -->
    <rect x="160" y="15" width="120" height="30" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="220" y="35" class="node" font-size="11">Training</text>

    <!-- Arrow -->
    <line x1="285" y1="30" x2="315" y2="30" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Deployment -->
    <rect x="320" y="15" width="120" height="30" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="380" y="35" class="node" font-size="11">Deployment</text>

    <!-- Arrow -->
    <line x1="445" y1="30" x2="475" y2="30" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Real Robot -->
    <rect x="480" y="15" width="120" height="30" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="540" y="35" class="node" font-size="11">Real Robot</text>
  </g>

  <!-- Benefits -->
  <g transform="translate(700, 150)">
    <text x="0" y="0" class="title">Benefits:</text>

    <text x="0" y="20" class="node" font-size="12">• Photorealistic Simulation</text>
    <text x="0" y="40" class="node" font-size="12">• High-Fidelity Physics</text>
    <text x="0" y="60" class="node" font-size="12">• Large-Scale Data Generation</text>
    <text x="0" y="80" class="node" font-size="12">• Domain Randomization</text>
    <text x="0" y="100" class="node" font-size="12">• GPU Acceleration</text>
    <text x="0" y="120" class="node" font-size="12">• ROS 2 Integration</text>
  </g>

  <!-- System Boundaries -->
  <rect x="50" y="100" width="900" height="620" rx="15" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="500" y="90" class="title" font-size="16">Complete Isaac Sim System</text>

  <!-- Legend -->
  <g transform="translate(50, 750)">
    <rect x="0" y="0" width="12" height="8" fill="#3B82F6"/>
    <text x="15" y="7" class="node" font-size="10">Data Flow</text>

    <rect x="90" y="0" width="12" height="8" fill="#8B5CF6"/>
    <text x="105" y="7" class="node" font-size="10">AI/ML Components</text>

    <rect x="180" y="0" width="12" height="8" fill="#10B981"/>
    <text x="195" y="7" class="node" font-size="10">Simulation</text>

    <rect x="270" y="0" width="12" height="8" fill="#F97316"/>
    <text x="285" y="7" class="node" font-size="10">ROS 2 Integration</text>
  </g>
</svg>