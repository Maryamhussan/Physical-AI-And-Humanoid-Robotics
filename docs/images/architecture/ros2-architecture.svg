<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #FEF3C7;
      stroke: #F59E0B;
      stroke-width: 2;
    }
    .component {
      font-size: 12px;
      fill: #374151;
    }
    .dataflow {
      stroke: #10B981;
      stroke-width: 2;
      stroke-dasharray: 5,5;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <marker id="datahead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#F9FAFB" />

  <!-- Title -->
  <text x="450" y="40" class="title" text-anchor="middle" font-size="24">ROS 2 Communication Architecture</text>
  <text x="450" y="70" class="node" font-size="16" fill="#4B5563">Distributed system with nodes, topics, services, and actions</text>

  <!-- ROS 2 Core Components -->
  <g transform="translate(450, 120)">
    <rect x="-120" y="0" width="240" height="80" rx="10" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="35" class="title">ROS 2 Core</text>
    <text x="0" y="55" class="node" font-size="12">DDS Middleware (Fast DDS, Cyclone DDS)</text>
  </g>

  <!-- Node Examples -->
  <g transform="translate(150, 250)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#E0E7FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="25" class="title">Camera Node</text>

    <!-- Publishers -->
    <rect x="10" y="40" width="60" height="25" rx="5" fill="#BFDBFE" stroke="#0369A1" stroke-width="1"/>
    <text x="40" y="58" class="node" font-size="10">/image_raw</text>

    <!-- Subscribers -->
    <rect x="90" y="40" width="60" height="25" rx="5" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <text x="120" y="58" class="node" font-size="10">/camera_info</text>

    <!-- Services -->
    <rect x="10" y="70" width="60" height="20" rx="3" fill="#A5F3FC" stroke="#0891B2" stroke-width="1"/>
    <text x="40" y="85" class="node" font-size="9">capture</text>
  </g>

  <g transform="translate(350, 250)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#E0E7FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="25" class="title">Navigation Node</text>

    <!-- Publishers -->
    <rect x="10" y="40" width="60" height="25" rx="5" fill="#BFDBFE" stroke="#0369A1" stroke-width="1"/>
    <text x="40" y="58" class="node" font-size="10">/cmd_vel</text>

    <!-- Subscribers -->
    <rect x="90" y="40" width="60" height="25" rx="5" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <text x="120" y="58" class="node" font-size="10">/scan</text>

    <!-- Actions -->
    <rect x="10" y="70" width="140" height="20" rx="3" fill="#A5F3FC" stroke="#0891B2" stroke-width="1"/>
    <text x="80" y="85" class="node" font-size="9">NavigateToPose</text>
  </g>

  <g transform="translate(550, 250)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#E0E7FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="80" y="25" class="title">Robot Driver</text>

    <!-- Publishers -->
    <rect x="10" y="40" width="60" height="25" rx="5" fill="#BFDBFE" stroke="#0369A1" stroke-width="1"/>
    <text x="40" y="58" class="node" font-size="10">/odom</text>

    <!-- Subscribers -->
    <rect x="90" y="40" width="60" height="25" rx="5" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <text x="120" y="58" class="node" font-size="10">/cmd_vel</text>

    <!-- Services -->
    <rect x="10" y="70" width="60" height="20" rx="3" fill="#A5F3FC" stroke="#0891B2" stroke-width="1"/>
    <text x="40" y="85" class="node" font-size="9">reset</text>
  </g>

  <!-- Action Server Example -->
  <g transform="translate(350, 400)">
    <rect x="0" y="0" width="160" height="100" rx="8" fill="#FECACA" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
    <text x="80" y="25" class="title" fill="#991B1B">Action Server</text>
    <text x="80" y="45" class="node" font-size="12">MoveRobotArm</text>

    <!-- Goal Handler -->
    <rect x="10" y="60" width="65" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="42.5" y="78" class="node" font-size="10">Goal</text>

    <!-- Feedback Publisher -->
    <rect x="85" y="60" width="65" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="117.5" y="78" class="node" font-size="10">Feedback</text>

    <!-- Result Publisher -->
    <rect x="10" y="85" width="140" height="10" rx="3" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="80" y="95" class="node" font-size="8">Result</text>
  </g>

  <!-- Communication Links -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- Camera to Navigation -->
    <line x1="230" y1="300" x2="350" y2="300" marker-end="url(#arrowhead)"/>

    <!-- Navigation to Robot Driver -->
    <line x1="510" y1="300" x2="550" y2="300" marker-end="url(#arrowhead)"/>

    <!-- Robot Driver to Navigation -->
    <line x1="550" y1="280" x2="510" y2="280" marker-end="url(#arrowhead)"/>

    <!-- Navigation to Action Server -->
    <line x1="430" y1="350" x2="430" y2="400" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Topic Communication Example -->
  <g transform="translate(150, 420)">
    <rect x="0" y="0" width="200" height="150" rx="10" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" class="title" fill="#047857">Topic Communication</text>

    <!-- Publisher -->
    <rect x="20" y="50" width="70" height="40" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="55" y="70" class="node" font-size="11">Publisher</text>

    <!-- Topic -->
    <rect x="100" y="60" width="50" height="20" rx="3" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="125" y="75" class="node" font-size="9">/topic</text>

    <!-- Subscriber 1 -->
    <rect x="20" y="110" width="70" height="30" rx="5" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="55" y="130" class="node" font-size="10">Sub 1</text>

    <!-- Subscriber 2 -->
    <rect x="110" y="110" width="70" height="30" rx="5" fill="#A7F3D0" stroke="#065F46" stroke-width="1"/>
    <text x="145" y="130" class="node" font-size="10">Sub 2</text>

    <!-- Arrows -->
    <line x1="90" y1="70" x2="100" y2="70" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="55" y1="90" x2="55" y2="110" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="135" y1="80" x2="135" y2="110" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Service Communication Example -->
  <g transform="translate(400, 500)">
    <rect x="0" y="0" width="200" height="120" rx="10" fill="#FEF7ED" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" class="title" fill="#92400E">Service Communication</text>

    <!-- Client -->
    <rect x="20" y="50" width="70" height="30" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="55" y="70" class="node" font-size="11">Client</text>

    <!-- Service -->
    <rect x="110" y="50" width="70" height="30" rx="5" fill="#FCD34D" stroke="#F59E0B" stroke-width="1"/>
    <text x="145" y="70" class="node" font-size="11">Server</text>

    <!-- Request -->
    <line x1="90" y1="60" x2="110" y2="60" stroke="#F97316" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="100" y="55" font-size="10" fill="#F97316">Request</text>

    <!-- Response -->
    <line x1="110" y1="75" x2="90" y2="75" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="100" y="90" font-size="10" fill="#10B981">Response</text>
  </g>

  <!-- Action Communication Example -->
  <g transform="translate(650, 420)">
    <rect x="0" y="0" width="200" height="180" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2" filter="url(#shadow)"/>
    <text x="100" y="25" class="title" fill="#9D174D">Action Communication</text>

    <!-- Client -->
    <rect x="20" y="50" width="70" height="30" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="55" y="70" class="node" font-size="11">Client</text>

    <!-- Server -->
    <rect x="110" y="50" width="70" height="30" rx="5" fill="#F9A8D4" stroke="#BE185D" stroke-width="1"/>
    <text x="145" y="70" class="node" font-size="11">Server</text>

    <!-- Goal -->
    <line x1="90" y1="60" x2="110" y2="60" stroke="#DB2777" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="100" y="55" font-size="9" fill="#DB2777">Goal</text>

    <!-- Feedback -->
    <line x1="110" y1="75" x2="90" y2="75" stroke="#F472B6" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
    <text x="100" y="90" font-size="9" fill="#F472B6">Feedback</text>

    <!-- Result -->
    <line x1="110" y1="95" x2="90" y2="95" stroke="#BE185D" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="100" y="110" font-size="9" fill="#BE185D">Result</text>

    <!-- Status -->
    <line x1="110" y1="115" x2="90" y2="115" stroke="#EC4899" stroke-width="1" stroke-dasharray="4,2" marker-end="url(#arrowhead)"/>
    <text x="100" y="130" font-size="9" fill="#EC4899">Status</text>
  </g>

  <!-- System Overview -->
  <g transform="translate(50, 620)">
    <text x="0" y="0" class="title">ROS 2 Communication Patterns:</text>

    <rect x="0" y="15" width="15" height="10" fill="#10B981"/>
    <text x="20" y="25" class="node" font-size="12">Topics (Pub/Sub)</text>

    <rect x="150" y="15" width="15" height="10" fill="#F97316"/>
    <text x="170" y="25" class="node" font-size="12">Services (Req/Res)</text>

    <rect x="320" y="15" width="15" height="10" fill="#DB2777"/>
    <text x="340" y="25" class="node" font-size="12">Actions (Goal/Feedback/Result)</text>
  </g>

  <!-- Node Communication Legend -->
  <g transform="translate(500, 620)">
    <text x="0" y="0" class="title">Node Communication:</text>

    <circle cx="10" cy="15" r="6" fill="#E0E7FF" stroke="#2563EB" stroke-width="1"/>
    <text x="25" y="20" class="node" font-size="12">Publisher</text>

    <circle cx="100" cy="15" r="6" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <text x="115" y="20" class="node" font-size="12">Subscriber</text>

    <circle cx="200" cy="15" r="6" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="215" y="20" class="node" font-size="12">Action Client</text>

    <circle cx="300" cy="15" r="6" fill="#F9A8D4" stroke="#BE185D" stroke-width="1"/>
    <text x="315" y="20" class="node" font-size="12">Action Server</text>
  </g>

  <!-- Architecture Boundary -->
  <rect x="40" y="100" width="820" height="500" rx="15" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="450" y="90" class="title" font-size="16">ROS 2 Distributed Architecture</text>
</svg>