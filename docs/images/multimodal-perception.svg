<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .sensor {
      fill: #C7D2FE;
      stroke: #4F46E5;
      stroke-width: 1.5;
    }
    .processing {
      fill: #D1FAE5;
      stroke: #065F46;
      stroke-width: 1.5;
    }
    .fusion {
      fill: #FDE68A;
      stroke: #F59E0B;
      stroke-width: 2;
    }
    .output {
      fill: #FECACA;
      stroke: #DC2626;
      stroke-width: 1.5;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#F9FAFB" />

  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle" font-size="24">Multimodal Perception System</text>
  <text x="500" y="70" class="node" font-size="16" fill="#4B5563">Integration of Vision, Audio, and Sensor Modalities</text>

  <!-- Input Modalities -->
  <g transform="translate(100, 120)">
    <!-- Camera Sensor -->
    <rect x="0" y="0" width="120" height="80" rx="8" class="sensor" filter="url(#shadow)"/>
    <text x="60" y="30" class="title">Camera</text>
    <text x="60" y="50" class="node" font-size="12">RGB-D, Stereo</text>
    <text x="60" y="65" class="node" font-size="10">640×480 to 4K</text>

    <!-- LiDAR Sensor -->
    <rect x="140" y="0" width="120" height="80" rx="8" class="sensor" filter="url(#shadow)"/>
    <text x="200" y="30" class="title">LiDAR</text>
    <text x="200" y="50" class="node" font-size="12">3D Scanning</text>
    <text x="200" y="65" class="node" font-size="10">360° FOV</text>

    <!-- IMU Sensor -->
    <rect x="280" y="0" width="120" height="80" rx="8" class="sensor" filter="url(#shadow)"/>
    <text x="340" y="30" class="title">IMU</text>
    <text x="340" y="50" class="node" font-size="12">Inertial</text>
    <text x="340" y="65" class="node" font-size="10">Accel + Gyro</text>

    <!-- Microphone Array -->
    <rect x="420" y="0" width="120" height="80" rx="8" class="sensor" filter="url(#shadow)"/>
    <text x="480" y="30" class="title">Microphones</text>
    <text x="480" y="50" class="node" font-size="12">Audio Array</text>
    <text x="480" y="65" class="node" font-size="10">Directional</text>
  </g>

  <!-- Preprocessing Units -->
  <g transform="translate(100, 240)">
    <!-- Vision Preprocessing -->
    <rect x="0" y="0" width="120" height="60" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="60" y="25" class="title">Vision</text>
    <text x="60" y="45" class="node" font-size="12">Preprocessing</text>

    <!-- LiDAR Preprocessing -->
    <rect x="140" y="0" width="120" height="60" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="200" y="25" class="title">LiDAR</text>
    <text x="200" y="45" class="node" font-size="12">Preprocessing</text>

    <!-- IMU Preprocessing -->
    <rect x="280" y="0" width="120" height="60" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="340" y="25" class="title">IMU</text>
    <text x="340" y="45" class="node" font-size="12">Preprocessing</text>

    <!-- Audio Preprocessing -->
    <rect x="420" y="0" width="120" height="60" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="480" y="25" class="title">Audio</text>
    <text x="480" y="45" class="node" font-size="12">Preprocessing</text>
  </g>

  <!-- Feature Extraction -->
  <g transform="translate(100, 340)">
    <!-- Vision Features -->
    <rect x="0" y="0" width="120" height="70" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="60" y="25" class="title">Vision</text>
    <text x="60" y="40" class="node" font-size="12">Feature</text>
    <text x="60" y="55" class="node" font-size="10">CNN, Vision Transformers</text>

    <!-- LiDAR Features -->
    <rect x="140" y="0" width="120" height="70" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="200" y="25" class="title">LiDAR</text>
    <text x="200" y="40" class="node" font-size="12">Feature</text>
    <text x="200" y="55" class="node" font-size="10">PointNet, Range View</text>

    <!-- IMU Features -->
    <rect x="280" y="0" width="120" height="70" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="340" y="25" class="title">IMU</text>
    <text x="340" y="40" class="node" font-size="12">Feature</text>
    <text x="340" y="55" class="node" font-size="10">Orientation, Motion</text>

    <!-- Audio Features -->
    <rect x="420" y="0" width="120" height="70" rx="6" class="processing" filter="url(#shadow)"/>
    <text x="480" y="25" class="title">Audio</text>
    <text x="480" y="40" class="node" font-size="12">Feature</text>
    <text x="480" y="55" class="node" font-size="10">MFCC, Spectrogram</text>
  </g>

  <!-- Multimodal Fusion -->
  <g transform="translate(300, 450)">
    <rect x="0" y="0" width="200" height="100" rx="10" class="fusion" filter="url(#shadow)"/>
    <text x="100" y="30" class="title">Multimodal</text>
    <text x="100" y="50" class="title">Fusion</text>
    <text x="100" y="70" class="node" font-size="12">Transformer-based</text>
    <text x="100" y="85" class="node" font-size="10">Cross-attention Mechanisms</text>
  </g>

  <!-- High-Level Perception -->
  <g transform="translate(300, 580)">
    <!-- Object Detection & Recognition -->
    <rect x="-150" y="0" width="120" height="60" rx="6" class="output" filter="url(#shadow)"/>
    <text x="-90" y="25" class="title">Object</text>
    <text x="-90" y="45" class="node" font-size="12">Recognition</text>

    <!-- Spatial Understanding -->
    <rect x="-20" y="0" width="120" height="60" rx="6" class="output" filter="url(#shadow)"/>
    <text x="40" y="25" class="title">Spatial</text>
    <text x="40" y="45" class="node" font-size="12">Understanding</text>

    <!-- Audio Processing -->
    <rect x="110" y="0" width="120" height="60" rx="6" class="output" filter="url(#shadow)"/>
    <text x="170" y="25" class="title">Audio</text>
    <text x="170" y="45" class="node" font-size="12">Processing</text>
  </g>

  <!-- Output Applications -->
  <g transform="translate(300, 670)">
    <!-- Navigation -->
    <rect x="-150" y="0" width="100" height="40" rx="5" fill="#FCE7F3" stroke="#DB2777" stroke-width="1"/>
    <text x="-100" y="25" class="node" font-size="12">Navigation</text>

    <!-- Manipulation -->
    <rect x="-30" y="0" width="100" height="40" rx="5" fill="#FCE7F3" stroke="#DB2777" stroke-width="1"/>
    <text x="20" y="25" class="node" font-size="12">Manipulation</text>

    <!-- Human-Robot Interaction -->
    <rect x="110" y="0" width="100" height="40" rx="5" fill="#FCE7F3" stroke="#DB2777" stroke-width="1"/>
    <text x="160" y="20" class="node" font-size="11">Human-Robot</text>
    <text x="160" y="35" class="node" font-size="11">Interaction</text>
  </g>

  <!-- Data Flow Connections -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- Sensors to Preprocessing -->
    <line x1="60" y1="200" x2="60" y2="240" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="200" x2="200" y2="240" marker-end="url(#arrowhead)"/>
    <line x1="340" y1="200" x2="340" y2="240" marker-end="url(#arrowhead)"/>
    <line x1="480" y1="200" x2="480" y2="240" marker-end="url(#arrowhead)"/>

    <!-- Preprocessing to Feature Extraction -->
    <line x1="60" y1="300" x2="60" y2="340" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="300" x2="200" y2="340" marker-end="url(#arrowhead)"/>
    <line x1="340" y1="300" x2="340" y2="340" marker-end="url(#arrowhead)"/>
    <line x1="480" y1="300" x2="480" y2="340" marker-end="url(#arrowhead)"/>

    <!-- Features to Fusion -->
    <line x1="60" y1="410" x2="300" y2="450" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="410" x2="350" y2="450" marker-end="url(#arrowhead)"/>
    <line x1="340" y1="410" x2="400" y2="450" marker-end="url(#arrowhead)"/>
    <line x1="480" y1="410" x2="450" y2="450" marker-end="url(#arrowhead)"/>

    <!-- Fusion to High-Level Perception -->
    <line x1="350" y1="550" x2="240" y2="580" marker-end="url(#arrowhead)"/>
    <line x1="400" y1="550" x2="400" y2="580" marker-end="url(#arrowhead)"/>
    <line x1="450" y1="550" x2="520" y2="580" marker-end="url(#arrowhead)"/>

    <!-- High-Level Perception to Applications -->
    <line x1="240" y1="640" x2="200" y2="670" marker-end="url(#arrowhead)"/>
    <line x1="400" y1="640" x2="400" y2="670" marker-end="url(#arrowhead)"/>
    <line x1="520" y1="640" x2="560" y2="670" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Cross-Modal Attention -->
  <g stroke="#F97316" stroke-width="1.5" stroke-dasharray="5,3">
    <!-- Vision-LiDAR Attention -->
    <line x1="60" y1="375" x2="200" y2="375" marker-end="url(#arrowhead)"/>
    <line x1="200" y1="375" x2="60" y2="375" marker-end="url(#arrowhead)"/>

    <!-- Vision-Audio Attention -->
    <path d="M 60 375 C 270 350, 480 375, 480 375" marker-end="url(#arrowhead)"/>

    <!-- LiDAR-IMU Attention -->
    <line x1="200" y1="375" x2="340" y2="375" marker-end="url(#arrowhead)"/>
    <line x1="340" y1="375" x2="200" y2="375" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Processing Pipeline Labels -->
  <g font-size="10" fill="#4F46E5" font-weight="bold">
    <text x="50" y="220">Raw Data</text>
    <text x="190" y="220">Acquisition</text>

    <text x="50" y="320">Preprocessing</text>
    <text x="190" y="320">& Filtering</text>

    <text x="50" y="430">Feature</text>
    <text x="190" y="430">Extraction</text>

    <text x="380" y="540">Multimodal</text>
    <text x="380" y="555">Fusion</text>
  </g>

  <!-- Modality Characteristics -->
  <g transform="translate(700, 120)">
    <text x="0" y="0" class="title">Modality Characteristics</text>

    <!-- Vision -->
    <rect x="0" y="20" width="200" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="100" y="35" class="node" font-size="12">Vision: Rich spatial, temporal data</text>
    <text x="100" y="50" class="node" font-size="10">High bandwidth, semantic understanding</text>

    <!-- LiDAR -->
    <rect x="0" y="70" width="200" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="100" y="85" class="node" font-size="12">LiDAR: Accurate depth, 3D structure</text>
    <text x="100" y="100" class="node" font-size="10">Geometric precision, occlusion handling</text>

    <!-- Audio -->
    <rect x="0" y="120" width="200" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="100" y="135" class="node" font-size="12">Audio: Directional, temporal cues</text>
    <text x="100" y="150" class="node" font-size="10">Speech, sound localization</text>

    <!-- IMU -->
    <rect x="0" y="170" width="200" height="40" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="100" y="185" class="node" font-size="12">IMU: Motion, orientation data</text>
    <text x="100" y="200" class="node" font-size="10">Inertial measurement, stability</text>
  </g>

  <!-- Fusion Strategies -->
  <g transform="translate(700, 300)">
    <text x="0" y="0" class="title">Fusion Strategies</text>

    <!-- Early Fusion -->
    <rect x="0" y="20" width="200" height="30" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="100" y="40" class="node" font-size="12">Early Fusion: Combine raw features</text>

    <!-- Late Fusion -->
    <rect x="0" y="60" width="200" height="30" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="100" y="80" class="node" font-size="12">Late Fusion: Combine decisions</text>

    <!-- Intermediate Fusion -->
    <rect x="0" y="100" width="200" height="30" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="100" y="120" class="node" font-size="12">Intermediate: Cross-attention</text>

    <!-- Decision Fusion -->
    <rect x="0" y="140" width="200" height="30" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="100" y="160" class="node" font-size="12">Decision Fusion: Weighted voting</text>
  </g>

  <!-- Applications -->
  <g transform="translate(700, 450)">
    <text x="0" y="0" class="title">Applications</text>

    <!-- Object Detection -->
    <rect x="0" y="20" width="200" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="100" y="37" class="node" font-size="11">Object Detection & Recognition</text>

    <!-- SLAM -->
    <rect x="0" y="55" width="200" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="100" y="72" class="node" font-size="11">Simultaneous Localization & Mapping</text>

    <!-- Human Tracking -->
    <rect x="0" y="90" width="200" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="100" y="107" class="node" font-size="11">Human Detection & Tracking</text>

    <!-- Scene Understanding -->
    <rect x="0" y="125" width="200" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="100" y="142" class="node" font-size="11">Scene Understanding & Semantics</text>

    <!-- Voice Commands -->
    <rect x="0" y="160" width="200" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="100" y="177" class="node" font-size="11">Voice Command Recognition</text>

    <!-- Sound Localization -->
    <rect x="0" y="195" width="200" height="25" rx="5" fill="#FECACA" stroke="#DC2626" stroke-width="1"/>
    <text x="100" y="212" class="node" font-size="11">Sound Source Localization</text>
  </g>

  <!-- Technical Challenges -->
  <g transform="translate(700, 600)">
    <text x="0" y="0" class="title">Technical Challenges</text>

    <text x="0" y="20" class="node" font-size="11">• Temporal synchronization</text>
    <text x="0" y="35" class="node" font-size="11">• Spatial calibration</text>
    <text x="0" y="50" class="node" font-size="11">• Data rate management</text>
    <text x="0" y="65" class="node" font-size="11">• Noise reduction</text>
    <text x="0" y="80" class="node" font-size="11">• Computational efficiency</text>
    <text x="0" y="95" class="node" font-size="11">• Robustness to failures</text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 650)">
    <rect x="0" y="0" width="15" height="10" class="sensor"/>
    <text x="20" y="10" class="node" font-size="12">Sensors</text>

    <rect x="100" y="0" width="15" height="10" class="processing"/>
    <text x="120" y="10" class="node" font-size="12">Processing</text>

    <rect x="200" y="0" width="15" height="10" class="fusion"/>
    <text x="220" y="10" class="node" font-size="12">Fusion</text>

    <rect x="280" y="0" width="15" height="10" class="output"/>
    <text x="300" y="10" class="node" font-size="12">Output</text>

    <line x1="380" y1="5" x2="395" y2="5" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="400" y="10" class="node" font-size="12">Data Flow</text>

    <line x1="480" y1="5" x2="495" y2="5" stroke="#F97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
    <text x="500" y="10" class="node" font-size="12">Attention</text>
  </g>

  <!-- System Overview Box -->
  <rect x="80" y="100" width="560" height="520" rx="15" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="360" y="90" class="title" font-size="14">Multimodal Perception Pipeline</text>
</svg>