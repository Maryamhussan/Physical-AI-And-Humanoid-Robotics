<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for modern look -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main background -->
  <rect width="400" height="100" fill="white" />

  <!-- Robot head with AI elements -->
  <g transform="translate(30, 20)">
    <!-- Robot head -->
    <rect x="0" y="0" width="60" height="60" rx="10" fill="url(#blueGradient)" />

    <!-- AI brain pattern -->
    <path d="M15,20 Q30,10 45,20 Q30,30 15,20 M15,30 Q30,40 45,30 Q30,50 15,30" fill="white" opacity="0.3"/>

    <!-- Eyes -->
    <circle cx="20" cy="25" r="5" fill="white" />
    <circle cx="40" cy="25" r="5" fill="white" />
    <circle cx="20" cy="25" r="2" fill="#f97316" />
    <circle cx="40" cy="25" r="2" fill="#f97316" />

    <!-- Mouth/indicator -->
    <rect x="25" y="40" width="10" height="3" rx="1.5" fill="white" opacity="0.7" />
  </g>

  <!-- Title text -->
  <text x="110" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#1e40af">Physical AI</text>
  <text x="110" y="75" font-family="Arial, sans-serif" font-size="20" fill="#3b82f6" font-weight="500">Humanoid Robotics</text>

  <!-- Subtle circuit pattern background -->
  <path d="M0,80 L400,80 M0,85 L400,85 M0,90 L400,90" stroke="#dbeafe" stroke-width="1" opacity="0.5"/>
</svg>