<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #F97316;
      opacity: 0.2;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#F9FAFB" />

  <!-- Title -->
  <text x="400" y="40" class="title">Vision-Language-Action (VLA) System Architecture</text>

  <!-- Human User -->
  <g transform="translate(100, 100)">
    <circle cx="0" cy="0" r="30" fill="#1E3A8A" opacity="0.8"/>
    <text x="0" y="5" class="node" fill="white">User</text>
    <text x="0" y="25" class="node" fill="#3B82F6" font-size="12">Natural Language</text>
  </g>

  <!-- Speech to Text -->
  <g transform="translate(100, 200)">
    <rect x="-50" y="-20" width="100" height="40" rx="5" fill="#E0E7FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="0" y="5" class="node">Speech-to-Text</text>
    <text x="0" y="25" class="node" font-size="10" fill="#3B82F6">(Whisper)</text>
  </g>

  <!-- LLM Planner -->
  <g transform="translate(100, 300)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1"/>
    <text x="0" y="0" class="node">LLM Action</text>
    <text x="0" y="20" class="node">Planner</text>
    <text x="0" y="35" class="node" font-size="10" fill="#4F46E5">(GPT-4)</text>
  </g>

  <!-- Action Plan -->
  <g transform="translate(100, 400)">
    <rect x="-70" y="-20" width="140" height="40" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="0" y="5" class="node">Action Plan</text>
    <text x="0" y="25" class="node" font-size="10" fill="#92400E">(JSON)</text>
  </g>

  <!-- Vision Processing -->
  <g transform="translate(400, 200)">
    <rect x="-70" y="-30" width="140" height="60" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1"/>
    <text x="0" y="-10" class="node">Vision</text>
    <text x="0" y="10" class="node">Processing</text>
    <text x="0" y="30" class="node" font-size="10" fill="#1E40AF">(Object Detection)</text>
  </g>

  <!-- ROS 2 Infrastructure -->
  <g transform="translate(400, 350)">
    <rect x="-80" y="-30" width="160" height="60" rx="5" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
    <text x="0" y="-10" class="node">ROS 2</text>
    <text x="0" y="10" class="node">Infrastructure</text>
    <text x="0" y="30" class="node" font-size="10" fill="#065F46">(Actions, Services)</text>
  </g>

  <!-- Robot Execution -->
  <g transform="translate(400, 500)">
    <rect x="-60" y="-25" width="120" height="50" rx="5" fill="#FECACA" stroke="#EF4444" stroke-width="1"/>
    <text x="0" y="0" class="node">Robot</text>
    <text x="0" y="20" class="node">Execution</text>
    <text x="0" y="35" class="node" font-size="10" fill="#991B1B">(Physical)</text>
  </g>

  <!-- Physical World -->
  <g transform="translate(650, 300)">
    <rect x="-50" y="-25" width="100" height="50" rx="5" fill="#E0E7FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="0" y="0" class="node">Physical</text>
    <text x="0" y="20" class="node">World</text>
    <text x="0" y="35" class="node" font-size="10" fill="#3B82F6">(Environment)</text>
  </g>

  <!-- Connections -->
  <line x1="100" y1="130" x2="100" y2="180" class="connection"/>
  <line x1="100" y1="220" x2="100" y2="280" class="connection"/>
  <line x1="100" y1="320" x2="100" y2="380" class="connection"/>
  <line x1="130" y1="320" x2="340" y2="230" class="connection"/>
  <line x1="130" y1="420" x2="340" y2="380" class="connection"/>
  <line x1="400" y1="230" x2="400" y2="330" class="connection"/>
  <line x1="400" y1="410" x2="400" y2="470" class="connection"/>
  <line x1="460" y1="370" x2="600" y2="330" class="connection"/>
  <line x1="460" y1="520" x2="600" y2="370" class="connection"/>

  <!-- Highlighted path -->
  <path d="M 70,100 Q 200,150 370,220 Q 400,300 400,380 Q 400,470 400,500"
        stroke="#F97316" stroke-width="3" fill="none" opacity="0.5"/>

  <!-- Legend -->
  <g transform="translate(50, 520)">
    <rect x="0" y="0" width="20" height="10" fill="#1E3A8A" opacity="0.8"/>
    <text x="25" y="10" class="node" font-size="12" text-anchor="start">Human Input</text>

    <rect x="150" y="0" width="20" height="10" fill="#3B82F6" opacity="0.8"/>
    <text x="175" y="10" class="node" font-size="12" text-anchor="start">Data Flow</text>

    <rect x="300" y="0" width="20" height="10" fill="#F97316" opacity="0.8"/>
    <text x="325" y="10" class="node" font-size="12" text-anchor="start">AI Processing</text>
  </g>
</svg>