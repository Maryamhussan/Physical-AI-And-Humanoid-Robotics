openapi: 3.0.0
info:
  title: Physical AI & Humanoid Robotics Content API
  description: API for managing educational content in the Physical AI & Humanoid Robotics book
  version: 1.0.0
paths:
  /modules:
    get:
      summary: Get all book modules
      responses:
        '200':
          description: List of all modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Module'
  /modules/{moduleId}:
    get:
      summary: Get a specific module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Module details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Module'
  /modules/{moduleId}/sections:
    get:
      summary: Get all sections in a module
      parameters:
        - name: moduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of sections in the module
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Section'
  /search:
    get:
      summary: Search content across all modules
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'
components:
  schemas:
    Module:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        target_audience:
          type: string
        duration:
          type: number
        prerequisites:
          type: array
          items:
            type: string
        learning_outcomes:
          type: array
          items:
            type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/Section'
    Section:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        content_type:
          type: string
        word_count:
          type: number
        estimated_time:
          type: number
        dependencies:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
    Resource:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        url:
          type: string
        path:
          type: string
        description:
          type: string
    SearchResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content_snippet:
          type: string
        module:
          type: string
        section:
          type: string
        relevance_score:
          type: number