<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #FDE68A;
      stroke: #F59E0B;
      stroke-width: 2;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#FAFAFA" />

  <!-- Title -->
  <text x="450" y="40" class="title" text-anchor="middle">ROS 2 Communication Patterns</text>

  <!-- Publisher-Subscriber Pattern -->
  <g transform="translate(150, 100)">
    <text x="0" y="-20" class="title" text-anchor="middle">Topic Communication</text>

    <!-- Publisher Node -->
    <rect x="-80" y="0" width="70" height="40" rx="5" fill="#BFDBFE" stroke="#1D4ED8" stroke-width="1"/>
    <text x="-45" y="25" class="node">Publisher</text>

    <!-- Topic -->
    <ellipse cx="20" cy="20" rx="25" ry="15" fill="#E0E7FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="20" y="25" class="node" font-size="12">Topic</text>

    <!-- Subscriber Node -->
    <rect x="80" y="0" width="70" height="40" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="115" y="25" class="node">Subscriber</text>

    <!-- Arrows -->
    <line x1="-10" y1="20" x2="20" y2="20" class="connection"/>
    <line x1="45" y1="20" x2="80" y2="20" class="connection"/>
  </g>

  <!-- Service Pattern -->
  <g transform="translate(150, 200)">
    <text x="0" y="-20" class="title" text-anchor="middle">Service Communication</text>

    <!-- Client Node -->
    <rect x="-80" y="0" width="70" height="40" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="-45" y="25" class="node">Client</text>

    <!-- Service -->
    <rect x="-20" y="0" width="40" height="40" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="0" y="15" class="node" font-size="12">Service</text>
    <text x="0" y="30" class="node" font-size="10">Server</text>

    <!-- Request Arrow -->
    <line x1="-10" y1="20" x2="0" y2="20" stroke="#F97316" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="-5" y="15" font-size="10" fill="#F97316">Request</text>

    <!-- Response Arrow -->
    <line x1="0" y1="25" x2="-10" y2="25" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="-5" y="40" font-size="10" fill="#10B981">Response</text>
  </g>

  <!-- Action Pattern -->
  <g transform="translate(150, 320)">
    <text x="0" y="-20" class="title" text-anchor="middle">Action Communication</text>

    <!-- Client Node -->
    <rect x="-100" y="0" width="60" height="40" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="-70" y="25" class="node" font-size="12">Action</text>
    <text x="-70" y="40" class="node" font-size="12">Client</text>

    <!-- Goal Arrow -->
    <line x1="-40" y1="20" x2="-20" y2="20" stroke="#F97316" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="-30" y="15" font-size="10" fill="#F97316">Goal</text>

    <!-- Action Server -->
    <rect x="-20" y="0" width="40" height="80" rx="5" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1"/>
    <text x="0" y="15" class="node" font-size="12">Action</text>
    <text x="0" y="30" class="node" font-size="12">Server</text>
    <text x="0" y="45" class="node" font-size="10">(Long-running</text>
    <text x="0" y="60" class="node" font-size="10">task)</text>

    <!-- Feedback Arrow -->
    <line x1="0" y1="45" x2="-20" y2="45" stroke="#F59E0B" stroke-width="1" marker-end="url(#arrowhead)"/>
    <text x="-10" y="60" font-size="10" fill="#F59E0B">Feedback</text>

    <!-- Result Arrow -->
    <line x1="20" y1="20" x2="40" y2="20" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="30" y="15" font-size="10" fill="#10B981">Result</text>

    <!-- Action Client Node -->
    <rect x="40" y="0" width="60" height="40" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="70" y="25" class="node" font-size="12">Action</text>
    <text x="70" y="40" class="node" font-size="12">Client</text>
  </g>

  <!-- Complete Robot System -->
  <g transform="translate(500, 100)">
    <text x="0" y="-20" class="title" text-anchor="middle">Complete Robot System</text>

    <!-- Robot Node -->
    <rect x="-60" y="0" width="120" height="50" rx="5" fill="#E0E7FF" stroke="#2563EB" stroke-width="2"/>
    <text x="0" y="20" class="node">Robot</text>
    <text x="0" y="35" class="node">Node</text>

    <!-- Sensor Nodes -->
    <g transform="translate(0, 80)">
      <rect x="-50" y="0" width="40" height="30" rx="3" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
      <text x="-30" y="20" class="node" font-size="11">Camera</text>

      <rect x="10" y="0" width="40" height="30" rx="3" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
      <text x="30" y="20" class="node" font-size="11">LiDAR</text>
    </g>

    <!-- Control Nodes -->
    <g transform="translate(0, 130)">
      <rect x="-50" y="0" width="40" height="30" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
      <text x="-30" y="20" class="node" font-size="11">Motion</text>
      <text x="-30" y="35" class="node" font-size="11">Ctrl</text>

      <rect x="10" y="0" width="40" height="30" rx="3" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
      <text x="30" y="20" class="node" font-size="11">Nav</text>
      <text x="30" y="35" class="node" font-size="11">Stack</text>
    </g>

    <!-- Connections -->
    <line x1="0" y1="50" x2="0" y2="80" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="0" y1="110" x2="0" y2="130" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>

    <!-- External Interface -->
    <g transform="translate(0, 180)">
      <rect x="-60" y="0" width="120" height="40" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
      <text x="0" y="25" class="node">External</text>
      <text x="0" y="40" class="node">Interface</text>
    </g>

    <line x1="0" y1="160" x2="0" y2="180" stroke="#EF4444" stroke-width="2"/>
  </g>

  <!-- Communication Flow Example -->
  <g transform="translate(500, 300)">
    <text x="0" y="-20" class="title" text-anchor="middle">Communication Flow</text>

    <!-- Perception Node -->
    <rect x="-80" y="0" width="60" height="40" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="-50" y="25" class="node" font-size="12">Perception</text>

    <!-- Planning Node -->
    <rect x="20" y="0" width="60" height="40" rx="5" fill="#C7D2FE" stroke="#4F46E5" stroke-width="1"/>
    <text x="50" y="25" class="node" font-size="12">Planning</text>

    <!-- Control Node -->
    <rect x="120" y="0" width="60" height="40" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1"/>
    <text x="150" y="25" class="node" font-size="12">Control</text>

    <!-- Data Flow -->
    <line x1="-20" y1="20" x2="20" y2="20" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="80" y1="20" x2="120" y2="20" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Feedback -->
    <line x1="120" y1="35" x2="80" y2="35" stroke="#10B981" stroke-width="1" marker-end="url(#arrowhead)"/>
    <line x1="20" y1="35" x2="-20" y2="35" stroke="#10B981" stroke-width="1" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="20" height="15" fill="#BFDBFE"/>
    <text x="25" y="12" class="node" font-size="12">Publishers</text>

    <rect x="150" y="0" width="20" height="15" fill="#D1FAE5"/>
    <text x="175" y="12" class="node" font-size="12">Subscribers</text>

    <rect x="300" y="0" width="20" height="15" fill="#FDE68A"/>
    <text x="325" y="12" class="node" font-size="12">Services</text>

    <rect x="0" y="30" width="20" height="15" fill="#C7D2FE"/>
    <text x="25" y="42" class="node" font-size="12">Actions</text>

    <line x1="150" y1="37" x2="170" y2="37" stroke="#3B82F6" stroke-width="2"/>
    <text x="175" y="42" class="node" font-size="12">Data Flow</text>

    <line x1="300" y1="37" x2="320" y2="37" stroke="#10B981" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="325" y="42" class="node" font-size="12">Feedback</text>
  </g>

  <!-- Annotations -->
  <g transform="translate(20, 650)">
    <text class="node" font-size="14"><tspan font-weight="bold">Key Concepts:</tspan></text>
    <text x="0" y="20" class="node" font-size="12">• Topics: Continuous data streams (sensors, commands)</text>
    <text x="0" y="40" class="node" font-size="12">• Services: Request-response (map saving, calibration)</text>
    <text x="0" y="60" class="node" font-size="12">• Actions: Long-running tasks with feedback (navigation, manipulation)</text>
  </g>
</svg>