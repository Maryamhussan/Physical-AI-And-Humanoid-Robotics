<svg width="1000" height="800" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg">
  <style>
    .node {
      font-family: Arial, sans-serif;
      font-size: 14px;
      fill: #1F2937;
      text-anchor: middle;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      fill: #1E3A8A;
    }
    .connection {
      stroke: #3B82F6;
      stroke-width: 2;
      marker-end: url(#arrowhead);
    }
    .highlight {
      fill: #FEF3C7;
      stroke: #F59E0B;
      stroke-width: 2;
    }
    .platform {
      font-size: 16px;
      font-weight: bold;
      fill: #7C2D12;
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" fill="#F9FAFB" />

  <!-- Title -->
  <text x="500" y="40" class="title" text-anchor="middle" font-size="24">NVIDIA Isaac Sim Architecture</text>
  <text x="500" y="70" class="node" font-size="14" fill="#4B5563">Integration with ROS 2 and Physical AI Systems</text>

  <!-- Omniverse Platform -->
  <g transform="translate(500, 120)">
    <rect x="-150" y="0" width="300" height="80" rx="10" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="35" class="platform">NVIDIA Omniverse Platform</text>
    <text x="0" y="55" class="node" font-size="12" fill="#4F46E5">Universal Scene Description (USD)</text>
  </g>

  <!-- Isaac Sim Core -->
  <g transform="translate(500, 230)">
    <rect x="-120" y="0" width="240" height="60" rx="8" fill="#E0E7FF" stroke="#2563EB" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="0" y="25" class="title">Isaac Sim Core</text>
    <text x="0" y="45" class="node" font-size="12" fill="#1E40AF">Simulation Engine</text>
  </g>

  <!-- Sub-components -->
  <g transform="translate(200, 330)">
    <!-- PhysX Physics -->
    <rect x="0" y="0" width="140" height="50" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1" filter="url(#shadow)"/>
    <text x="70" y="20" class="node">PhysX Physics</text>
    <text x="70" y="38" class="node" font-size="10" fill="#92400E">Engine</text>

    <!-- RTX Rendering -->
    <rect x="160" y="0" width="140" height="50" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1" filter="url(#shadow)"/>
    <text x="230" y="20" class="node">RTX Rendering</text>
    <text x="230" y="38" class="node" font-size="10" fill="#92400E">Engine</text>

    <!-- AI Training -->
    <rect x="320" y="0" width="140" height="50" rx="5" fill="#FDE68A" stroke="#F59E0B" stroke-width="1" filter="url(#shadow)"/>
    <text x="390" y="20" class="node">AI Training</text>
    <text x="390" y="38" class="node" font-size="10" fill="#92400E">Framework</text>
  </g>

  <!-- Robot Models -->
  <g transform="translate(150, 420)">
    <!-- URDF/SDF Import -->
    <rect x="0" y="0" width="120" height="40" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="60" y="25" class="node" font-size="12">URDF/SDF</text>
    <text x="60" y="40" class="node" font-size="10" fill="#065F46">Import</text>

    <!-- USD Export -->
    <rect x="140" y="0" width="120" height="40" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="200" y="25" class="node" font-size="12">USD Robot</text>
    <text x="200" y="40" class="node" font-size="10" fill="#065F46">Model</text>

    <!-- USD Assets -->
    <rect x="280" y="0" width="120" height="40" rx="5" fill="#D1FAE5" stroke="#065F46" stroke-width="1"/>
    <text x="340" y="25" class="node" font-size="12">USD Assets</text>
    <text x="340" y="40" class="node" font-size="10" fill="#065F46">(Environments)</text>
  </g>

  <!-- ROS 2 Bridge -->
  <g transform="translate(500, 500)">
    <rect x="-100" y="0" width="200" height="50" rx="8" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="25" class="title">ROS 2 Bridge</text>
    <text x="0" y="42" class="node" font-size="12" fill="#4F46E5">Isaac ROS Extensions</text>
  </g>

  <!-- Isaac ROS Packages -->
  <g transform="translate(300, 580)">
    <!-- Perception -->
    <rect x="0" y="0" width="100" height="40" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="50" y="18" class="node" font-size="11">Perception</text>
    <text x="50" y="33" class="node" font-size="9" fill="#9D174D">Isaac ROS</text>

    <!-- Navigation -->
    <rect x="110" y="0" width="100" height="40" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="160" y="18" class="node" font-size="11">Navigation</text>
    <text x="160" y="33" class="node" font-size="9" fill="#9D174D">Isaac ROS</text>

    <!-- Manipulation -->
    <rect x="220" y="0" width="100" height="40" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="270" y="18" class="node" font-size="11">Manipulation</text>
    <text x="270" y="33" class="node" font-size="9" fill="#9D174D">Isaac ROS</text>

    <!-- Sensors -->
    <rect x="330" y="0" width="100" height="40" rx="5" fill="#FBCFE8" stroke="#BE185D" stroke-width="1"/>
    <text x="380" y="18" class="node" font-size="11">Sensors</text>
    <text x="380" y="33" class="node" font-size="9" fill="#9D174D">Isaac ROS</text>
  </g>

  <!-- Real Robot -->
  <g transform="translate(750, 400)">
    <rect x="-80" y="0" width="160" height="100" rx="10" fill="#E0F2FE" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="35" class="title">Physical Robot</text>
    <text x="0" y="55" class="node" font-size="12" fill="#0284C7">Hardware</text>
    <text x="0" y="75" class="node" font-size="10" fill="#0284C7">(Real World)</text>

    <!-- Robot Components -->
    <circle cx="-30" cy="70" r="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="1"/>
    <circle cx="0" cy="70" r="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="1"/>
    <circle cx="30" cy="70" r="8" fill="#0EA5E9" stroke="#0284C7" stroke-width="1"/>
  </g>

  <!-- Simulation Loop -->
  <g transform="translate(500, 680)">
    <text x="0" y="-15" class="title" text-anchor="middle">Simulation-to-Reality Pipeline</text>

    <!-- Synthetic Data -->
    <rect x="-150" y="0" width="100" height="40" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="-100" y="25" class="node" font-size="11">Synthetic</text>
    <text x="-100" y="40" class="node" font-size="10" fill="#5B21B6">Data</text>

    <!-- Transfer Learning -->
    <rect x="-30" y="0" width="100" height="40" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="20" y="25" class="node" font-size="11">Transfer</text>
    <text x="20" y="40" class="node" font-size="10" fill="#5B21B6">Learning</text>

    <!-- Real Deployment -->
    <rect x="120" y="0" width="100" height="40" rx="5" fill="#DDD6FE" stroke="#7C3AED" stroke-width="1"/>
    <text x="170" y="25" class="node" font-size="11">Real World</text>
    <text x="170" y="40" class="node" font-size="10" fill="#5B21B6">Deployment</text>
  </g>

  <!-- Connections -->
  <g stroke="#3B82F6" stroke-width="2">
    <!-- Omniverse to Isaac Sim -->
    <line x1="500" y1="200" x2="500" y2="230" marker-end="url(#arrowhead)"/>

    <!-- Isaac Sim to Components -->
    <line x1="500" y1="290" x2="270" y2="330" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="290" x2="400" y2="330" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="290" x2="530" y2="330" marker-end="url(#arrowhead)"/>

    <!-- Components to Robot Models -->
    <line x1="270" y1="380" x2="210" y2="420" marker-end="url(#arrowhead)"/>
    <line x1="400" y1="380" x2="360" y2="420" marker-end="url(#arrowhead)"/>
    <line x1="530" y1="380" x2="440" y2="420" marker-end="url(#arrowhead)"/>

    <!-- Robot Models to ROS Bridge -->
    <line x1="210" y1="460" x2="400" y2="500" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="460" x2="500" y2="500" marker-end="url(#arrowhead)"/>
    <line x1="440" y1="460" x2="600" y2="500" marker-end="url(#arrowhead)"/>

    <!-- ROS Bridge to Isaac ROS -->
    <line x1="500" y1="550" x2="350" y2="580" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="550" x2="410" y2="580" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="550" x2="470" y2="580" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="550" x2="530" y2="580" marker-end="url(#arrowhead)"/>

    <!-- Isaac ROS to Real Robot -->
    <line x1="600" y1="600" x2="700" y2="450" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

    <!-- Simulation Loop -->
    <line x1="350" y1="680" x2="400" y2="680" marker-end="url(#arrowhead)"/>
    <line x1="520" y1="680" x2="570" y2="680" marker-end="url(#arrowhead)"/>
  </g>

  <!-- Data Flow Labels -->
  <g font-size="10" fill="#3B82F6" font-weight="bold">
    <text x="350" y="310">Physics</text>
    <text x="450" y="310">Rendering</text>
    <text x="550" y="310">AI Training</text>

    <text x="180" y="410">Robot</text>
    <text x="320" y="410">Model</text>
    <text x="420" y="410">Assets</text>

    <text x="300" y="570">Perception</text>
    <text x="420" y="570">Navigation</text>
    <text x="520" y="570">Manipulation</text>
    <text x="620" y="570">Sensors</text>
  </g>

  <!-- Highlighted Path (Simulation Pipeline) -->
  <path d="M 500 160 Q 500 200 500 230 Q 500 270 400 330 Q 300 390 210 420 Q 150 450 210 460 Q 300 470 500 500 Q 600 530 700 450"
        stroke="#F97316" stroke-width="3" fill="none" stroke-dasharray="10,5" opacity="0.6"/>

  <!-- Legend -->
  <g transform="translate(50, 700)">
    <rect x="0" y="0" width="15" height="10" fill="#C7D2FE"/>
    <text x="20" y="10" class="node" font-size="12">Simulation Platform</text>

    <rect x="180" y="0" width="15" height="10" fill="#E0E7FF"/>
    <text x="200" y="10" class="node" font-size="12">Core Engine</text>

    <rect x="350" y="0" width="15" height="10" fill="#FDE68A"/>
    <text x="370" y="10" class="node" font-size="12">Physics/Rendering</text>

    <rect x="0" y="25" width="15" height="10" fill="#D1FAE5"/>
    <text x="20" y="35" class="node" font-size="12">Models/Data</text>

    <rect x="180" y="25" width="15" height="10" fill="#FBCFE8"/>
    <text x="200" y="35" class="node" font-size="12">ROS Packages</text>

    <rect x="350" y="25" width="15" height="10" fill="#E0F2FE"/>
    <text x="370" y="35" class="node" font-size="12">Physical Robot</text>

    <line x1="0" y1="50" x2="15" y2="50" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="20" y="55" class="node" font-size="12">Data Flow</text>

    <line x1="180" y1="50" x2="195" y2="50" stroke="#F97316" stroke-width="3" stroke-dasharray="10,5"/>
    <text x="210" y="55" class="node" font-size="12">Main Pipeline</text>
  </g>

  <!-- Annotations -->
  <g transform="translate(650, 650)">
    <text class="node" font-size="14" font-weight="bold">Key Benefits:</text>
    <text x="0" y="20" class="node" font-size="12">• Photorealistic simulation</text>
    <text x="0" y="40" class="node" font-size="12">• High-fidelity physics</text>
    <text x="0" y="60" class="node" font-size="12">• Synthetic data generation</text>
    <text x="0" y="80" class="node" font-size="12">• Domain randomization</text>
    <text x="0" y="100" class="node" font-size="12">• ROS 2 integration</text>
  </g>
</svg>